<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lander Sub-Apps Portal</title>
    <style>
        body {
            background-color: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        h1 {
            color: #00ff00;
            margin-bottom: 2rem;
            font-weight: 500;
        }

        .nav-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 310px;
        }

        fieldset.link-group {
            border: 1px solid #008800;
            border-radius: 6px;
            padding: 10px;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-sizing: border-box;
        }

        legend {
            color: #00ff00;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 0 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        a {
            display: block;
            padding: 4px 2px;
            background-color: #222;
            color: #00ff00;
            text-decoration: none;
            border: 1px solid #00ff00;
            border-radius: 6px;
            font-size: 1.00rem;
            font-weight: bold;
            transition: all 0.2s ease-in-out;
            text-align: center;
            box-sizing: border-box;
        }

        a:hover {
            background-color: #00ff00;
            color: #111;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.4);
        }
    </style>
</head>

<body>
    <h1>Lander Sub-Apps Portal</h1>
    <div class="nav-container">
        <fieldset class="link-group">
            <legend>Test Scene</legend>
            <a href="0.html?level=0">Test Scene 0</a>
            <a href="0.html?level=1">Test Scene 1</a>
        </fieldset>

        <fieldset class="link-group">
            <legend>Level Overview</legend>
            <a href="1.html?level=0">Level Overview 0</a>
            <a href="1.html?level=1">Level Overview 1</a>
        </fieldset>

        <fieldset class="link-group">
            <legend>Mountain Design</legend>
            <a href="2.html?level=0">Level Mountain Design 0</a>
            <a href="2.html?level=1">Level Mountain Design 1</a>
        </fieldset>
    </div>
</body>
</html>
