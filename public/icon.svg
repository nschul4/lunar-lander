<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Deep Space Background -->
  <rect width="512" height="512" fill="#000000"/>
  
  <!-- Starfield Accents -->
  <circle cx="80" cy="100" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="420" cy="80" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="450" cy="350" r="2" fill="#ffffff" opacity="0.9"/>
  <circle cx="60" cy="380" r="3" fill="#ffffff" opacity="0.5"/>
  <circle cx="200" cy="60" r="2" fill="#ffffff" opacity="0.7"/>

  <!-- Thruster Flame (Cyan/White) -->
  <polygon points="256,380 206,280 306,280" fill="#00ffff" opacity="0.8"/>
  <polygon points="256,350 226,280 286,280" fill="#ffffff"/>

  <!-- Lander Body (Matching LANDER_VERTICES) -->
  <!-- Main Hull -->
  <polygon points="256,120 376,300 256,240 136,300" fill="#aaaaaa" stroke="#ffffff" stroke-width="8" stroke-linejoin="round"/>
  
  <!-- Cockpit Highlight / Details -->
  <polygon points="256,140 336,270 256,230 176,270" fill="#888888"/>
  <circle cx="256" cy="200" r="16" fill="#00ff00"/>
</svg>
